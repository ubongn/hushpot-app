<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="HushPot — private group savings pots on Midnight. Pledge amounts stay secret; the pot only proves you've met the minimum." />
    <meta name="color-scheme" content="dark" />
    <link rel="icon" type="image/svg+xml" href="/hushpot.svg" />
    <title>HushPot — private savings pots on Midnight</title>
    <style>
      /* Boot screen: pure HTML/CSS, rendered before any JS/WASM loads.
         Replaced automatically when React mounts into #root. */
      .boot {
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 18px;
        background: #0b0e14;
        color: #e8eaf0;
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        text-align: center;
        padding: 24px;
      }
      .boot h1 {
        font-size: 28px;
        font-weight: 700;
        margin: 0;
        letter-spacing: 0.02em;
      }
      .boot p {
        margin: 0;
        color: #9aa0ae;
        font-size: 14px;
        max-width: 420px;
        line-height: 1.5;
      }
      .boot .ring {
        width: 34px;
        height: 34px;
        border-radius: 50%;
        border: 3px solid rgba(124, 92, 255, 0.25);
        border-top-color: #7c5cff;
        border-right-color: #00d4b8;
        animation: bootspin 0.9s linear infinite;
      }
      .boot .bar {
        width: 220px;
        height: 4px;
        border-radius: 2px;
        background: rgba(255, 255, 255, 0.08);
        overflow: hidden;
      }
      .boot .bar i {
        display: block;
        height: 100%;
        width: 40%;
        border-radius: 2px;
        background: linear-gradient(90deg, #7c5cff, #00d4b8);
        animation: bootslide 1.2s ease-in-out infinite;
      }
      @keyframes bootspin { to { transform: rotate(360deg); } }
      @keyframes bootslide {
        0% { transform: translateX(-100%); }
        100% { transform: translateX(350%); }
      }
      .boot .pct { font-size: 12px; color: #00d4b8; font-variant-numeric: tabular-nums; }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="boot" id="boot-screen">
        <div class="ring"></div>
        <h1>HushPot</h1>
        <p>Loading the zero-knowledge engine (~10 MB of cryptographic material, fetched in resumable chunks — safe on slow networks).</p>
        <div class="bar"><i></i></div>
        <div class="pct" id="boot-pct">preparing…</div>
        <script>
          // Reflect chunked-download progress on the boot screen.
          window.__hushpotProgress = function (done, total) {
            var el = document.getElementById('boot-pct');
            if (el && total > 0) {
              el.textContent = Math.round((done / total) / 1048576) + ' / ' +
                Math.round(total / 1048576) + ' MB loaded';
            }
          };
        </script>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
