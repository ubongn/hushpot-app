<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="g" x1="4" y1="4" x2="60" y2="60" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#7c5cff"/>
      <stop offset="1" stop-color="#00d4b8"/>
    </linearGradient>
  </defs>

  <!-- background -->
  <rect x="4" y="4" width="56" height="56" rx="14" fill="url(#g)"/>

  <!-- crescent moon lid (Midnight covers the pot = privacy) -->
  <circle cx="30" cy="15" r="8.5" fill="#0b0e14"/>
  <circle cx="33.5" cy="13.5" r="7" fill="url(#g)"/>

  <!-- pot rim -->
  <rect x="17" y="24" width="30" height="5" rx="2.5" fill="#0b0e14"/>

  <!-- pot body -->
  <path d="M19 29 C17 42, 23 51, 32 51 C41 51, 47 42, 45 29 Z" fill="#0b0e14"/>

  <!-- hidden amounts inside the pot: masked dots (echo of the UI's &#8226;&#8226;&#8226;&#8226;&#8226; NIGHT) -->
  <circle cx="25.5" cy="39" r="2.5" fill="#00d4b8"/>
  <circle cx="32" cy="39" r="2.5" fill="none" stroke="#9aa0ae" stroke-width="1.6"/>
  <circle cx="38.5" cy="39" r="2.5" fill="#7c5cff"/>

  <!-- verified-claim check at the base -->
  <path d="M27 55.5 l3.2 3.2 l6.8 -6.8" stroke="#00d4b8" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
</svg>
